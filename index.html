<!DOCTYPE html>
<html>
<head>
  <title>Lizzy Translate</title>
<link rel="manifest" href="manifest.json">
  <style>
    body {
      background: #000;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .logo {
      color: #FF6B00;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 40px;
    }
    textarea, .output {
      width: 100%;
      background: #1A1A1A;
      border: none;
      border-radius: 12px;
      padding: 20px;
      color: white;
      font-size: 16px;
      min-height: 150px;
      margin-bottom: 20px;
    }
    .lang-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      align-items: center;
    }
    select {
      flex: 1;
      background: #1A1A1A;
      border: none;
      border-radius: 8px;
      padding: 15px;
      color: white;
      font-size: 16px;
    }
    .swap {
      color: #FF6B00;
      font-size: 24px;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: #FF6B00;
      border: none;
      border-radius: 12px;
      padding: 18px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
  </style>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">
</head>
<body>
  <div class="container">
  <div class="logo">LIZZY TRANSLATE</div>
<textarea id="inputText" placeholder="Enter text to translate..."></textarea>

<div class="lang-row">
  <select id="fromLang" class="dropdown" style="width:48%;">
  <option value="en">English</option>
  <option value="ha">Hausa</option>
  <option value="yo">Yoruba</option>
  <option value="ig">Igbo</option>
  <option value="sw">Swahili</option>
  <option value="am">Amharic</option>
  <option value="zu">Zulu</option>
  <option value="xh">Xhosa</option>
  <option value="sn">Shona</option>
  <option value="so">Somali</option>
  <option value="rw">Kinyarwanda</option>
  <option value="lg">Luganda</option>
  <option value="ak">Twi</option>
  <option value="ff">Fulfulde</option>
  <option value="bm">Bambara</option>
  <option value="wo">Wolof</option>
  <option value="kr">Kanuri</option>
  <option value="nso">Sepedi</option>
  <option value="st">Sesotho</option>
  <option value="tn">Setswana</option>
</select>

  <button id="swapBtn" style="width:8%; background:none; border:none; font-size:20px; cursor:pointer;">&#8645;</button>
<select id="toLang" class="dropdown" style="width:44%;">
  <option value="ha">Hausa</option>
  <option value="en">English</option>
  <option value="yo">Yoruba</option>
  <option value="ig">Igbo</option>
  <option value="sw">Swahili</option>
  <option value="am">Amharic</option>
  <option value="zu">Zulu</option>
  <option value="xh">Xhosa</option>
  <option value="sn">Shona</option>
  <option value="so">Somali</option>
  <option value="rw">Kinyarwanda</option>
  <option value="lg">Luganda</option>
  <option value="ak">Twi</option>
  <option value="ff">Fulfulde</option>
  <option value="bm">Bambara</option>
  <option value="wo">Wolof</option>
  <option value="kr">Kanuri</option>
  <option value="nso">Sepedi</option>
  <option value="st">Sesotho</option>
  <option value="tn">Setswana</option>
</select>
</div>

<div style="display:flex; gap:4%;">
  <button id="micBtn" class="btn" style="width:48%; background:#ff6b6b;">🎤 Speak</button>
  <button id="translateBtn" class="btn" style="width:48%;">Translate</button>
</div>
<div id="outputText" class="output" style="position:relative; min-height:60px; padding:15px; padding-right:65px;">
  <span id="outputSpan">Translation will appear here...</span>
  <button id="copyBtn" style="position:absolute; top:8px; right:8px; display:none; background:#28a745; color:white; border:none; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer;">Copy</button>
</div>
<div id="history" style="margin-top:20px;"></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  
  function saveToHistory(input, output, fromLang, toLang) {
    let history = JSON.parse(localStorage.getItem('lizzyHistory') || '[]');
    history.unshift({input, output, fromLang, toLang});
    history = history.slice(0, 5);
    localStorage.setItem('lizzyHistory', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('lizzyHistory') || '[]');
    const historyDiv = document.getElementById('history');
    if (!historyDiv || history.length === 0) return;
    historyDiv.innerHTML = '<strong>Recent:</strong><br>' + history.map(item =>
      `<div style="padding:8px; border-bottom:1px solid #333; margin:5px 0; background:#1a1a1a; border-radius:4px; font-size:14px;">
        ${item.input} → ${item.output}
       </div>`
    ).join('');
  }
  
  renderHistory();
  
  document.getElementById('copyBtn').onclick = function() {
    const text = document.getElementById('outputSpan').innerText;
    navigator.clipboard.writeText(text);
    this.innerText = 'Copied!';
    setTimeout(() => this.innerText = 'Copy', 1500);
  };
  
  document.getElementById('swapBtn').onclick = function() {
    const from = document.getElementById('fromLang');
    const to = document.getElementById('toLang');
    [from.value, to.value] = [to.value, from.value];
  };
  
document.getElementById('translateBtn').onclick = async function() {
  const text = document.getElementById('inputText').value.toLowerCase().trim();
  const from = document.getElementById('fromLang').value;
  const to = document.getElementById('toLang').value;
  const output = document.getElementById('outputSpan');

  if (!text) {
    output.innerText = 'Please enter text';
    return;
  }

  output.innerText = 'Translating...';
  document.getElementById('copyBtn').style.display = 'none';

  try {
    let translatedText = '';

    // TIER 1: Check your custom datasets first
    let customDict = {};
    if (from === 'en' && to === 'ha') {
      const res = await fetch('./hausa.json');
      customDict = await res.json();
    } else if (from === 'en' && to === 'ff') {
      const res = await fetch('./fulfulde.json');
      customDict = await res.json();
    }

    translatedText = customDict[text];

    // TIER 2: If not in your dataset, use MyMemory API
    if (!translatedText) {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
      const data = await res.json();

      if (data.responseStatus === 200 && data.responseData.translatedText!== 'NO QUERY SPECIFIED') {
        translatedText = data.responseData.translatedText;
      }
    }

    // TIER 3: If both fail, be honest
    if (!translatedText) {
      output.innerText = `"${text}" not found. We're training Lizzy on new words daily. Try another word.`;
      return;
    }

    // Success
    output.innerText = translatedText;
    document.getElementById('copyBtn').style.display = 'block';
    saveToHistory(text, translatedText, from, to);

  } catch (e) {
    output.innerText = 'Network error. Lizzy needs internet for new words.';
  }
};
  
});
</script>
</body>
</html>
